[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pruned-attention"
version = "0.1.0"
description = "A project implementing and fine-tuning a compressed attention mechanism for Llama models."
authors = [{ name = "Your Name", email = "your@email.com" }]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "tqdm",
    "accelerate",
]

[project.urls]
Homepage = "https://github.com/your-username/pruned_attention" # Replace with your URL

[tool.setuptools.packages.find]
where = ["src"]
